  { t: '레이아웃 정리', d: 'Redraw Layout을 누르면 관계 방향에 맞춰 그래프가 다시 배치됩니다. Credit이 왼쪽 중심에 오고 Movie, Person, CreditType이 오른쪽으로 펼쳐져 구조가 한눈에 보입니다.',
    p: ['툴바 Redraw Layout'],
    done: () => !!S.flags.layout, apply: redrawLayout,
    async run(D) { await D.click('[data-act=layout]'); await D.wait(500); } },
  { t: '속성 추가', d: '클래스에 값을 붙입니다. Movie에는 title(string)과 releaseYear(gYear), Credit에는 creditOrder(integer)와 characterName(string)을 추가합니다. 노드 오른쪽 아래 숫자가 속성 개수이고, Rule 열에서 필수 여부 같은 제약도 걸 수 있습니다.',
    p: ['노드 클릭', 'See details', 'Attributes 탭', '이름·Data Type', 'Add'],
    done: () => ATTRS.every(([c, a]) => clsByName(c)?.attrs.some(x => x.name === a)),
    apply: () => ATTRS.forEach(([c, a, t]) => addAttr(clsByName(c), a, t)),
    async run(D) {
      for (const cn of ['Movie', 'Credit']) {
        const todo = ATTRS.filter(x => x[0] === cn && !clsByName(cn).attrs.some(a => a.name === x[1])); if (!todo.length) continue;
        await D.clickNode(clsByName(cn), 'See details'); await D.click('[data-tab2=Attributes]');
        for (const [, a, t] of todo) { await D.pick('attrName', a, true); await D.pick('attrType', t); await D.click('#aAdd'); await D.wait(250); }
        await D.wait(500); await D.click('#drawer [data-close]');
      }
    } },
  { t: '데이터 업로드', d: 'Resources의 +에서 원천 CSV 네 개(MOVIE, MOVIE_CREDIT, PERSON, CREDIT_TYPE_CODE)를 올립니다. Designer는 파일마다 열과 행 수를 분석해 보여 주고, 만든 리소스는 캔버스에 파일 아이콘으로 나타납니다.',
    p: ['Resources +', 'Add data', 'Choose files', '파일 선택 → 열기', 'Create'],
    done: () => FILES.every(f => resByName(f)),
    apply: () => FILES.forEach(n => { if (!resByName(n)) { const f = fileOf(n); S.resources.push(makeResource(n, f.cols, f.rows)); } }),
    async run(D) {
      await D.click('[data-act=add-data]'); await D.click('#chooseFiles');
      let first = true;
      for (const n of FILES) { if (resByName(n)) continue; const row = await D.find(`tr[data-fname="${n}.csv"]`); await D.point(row); D.ripple(D.gx, D.gy); row.dispatchEvent(new MouseEvent('click', { ctrlKey: !first, bubbles: true })); first = false; await D.wait(220); }
      await D.click('#fpOpen'); await D.wait(700); await D.click('#upCreate'); await D.wait(400);
    } },
  { t: '리소스 미리보기', d: 'MOVIE_CREDIT.csv를 열어 내용을 확인합니다. 열마다 고유값 비율과 레코드 수가 보이므로, credit_id처럼 100% 고유한 열은 식별자로, movie_id·person_id는 다른 클래스와의 연결 키로 쓸 수 있음을 알 수 있습니다.',
    p: ['리소스 아이콘 클릭', 'View preview'],
    done: () => STEPS[4].done(), apply: () => {},
    async run(D) { await D.clickNode(resByName('MOVIE_CREDIT'), 'View preview'); await D.wait(3200); await D.click('#modalLayer [data-mclose]'); } },
  { t: '매핑 만들기', d: '리소스를 클래스에 연결합니다. New Mapping에서 대상 클래스를 고르면 Voicebox가 식별자, 관계, 속성 매핑을 제안하고 캔버스에 파란 점선으로 미리 보여 줍니다. 클래스를 비워 두면 Voicebox가 새 개념을 만들어 줍니다.',
    p: ['리소스 아이콘 클릭', 'New Mapping', 'Select classes', 'Create'],
    done: () => MAPS.every(([r, c]) => S.mappings.some(m => res(m.res)?.name === r && cls(m.cls)?.name === c)),
    apply: () => MAPS.forEach(([r, c]) => { if (!S.mappings.some(m => res(m.res)?.name === r && cls(m.cls)?.name === c)) createMappings([resByName(r).id], [clsByName(c).id]); }),
    async run(D) {
      for (const [r, c] of MAPS) { if (S.mappings.some(m => res(m.res)?.name === r && cls(m.cls)?.name === c)) continue;
        await D.clickNode(resByName(r), 'New Mapping'); await D.pick('nmCls', c); await D.wait(250); await D.click('#nmCreate'); await D.wait(900); }
    } },
  { t: '매핑 확인', d: 'Mapping 탭에서 MOVIE_CREDIT - Credit 매핑을 엽니다. credit_id로 각 크레딧의 IRI를 만들고, movie_id·person_id·credit_type_cd로 Movie, Person, CreditType과 연결됩니다. SMS 코드 보기로 실제 매핑 문법도 확인할 수 있습니다.',
    p: ['Mapping 탭', 'MOVIE_CREDIT - Credit', 'SMS 코드 보기'],
    done: () => STEPS[6].done(), apply: () => {},
    async run(D) {
      await D.click('[data-tab=mapping]');
      const m = S.mappings.find(x => res(x.res)?.name === 'MOVIE_CREDIT');
      await D.click(`[data-tmap="${m.id}"]`); await D.wait(2600);
      await D.click('#mvSms'); await D.wait(2600); await D.click('#mvSms'); await D.wait(400);
      await D.click('[data-tab=model]');
    } },
  { t: '승인과 게시', d: 'Accept Changes로 제안을 확정하고 Publish로 데이터베이스에 게시합니다. 게시가 끝나면 Explorer에서 인터스텔라를 중심으로 감독, 배우, 역할이 연결된 지식그래프를 탐색할 수 있습니다.',
    p: ['Accept Changes', 'Publish', 'Explorer에서 보기'],
    done: () => !!S.published,
    apply: () => { if (S.pending) acceptChanges(); S.published = { db: S.project.toLowerCase() + '_kg', at: Date.now() }; S.flags.published = true; },
    async run(D) {
      if (S.pending) await D.click('[data-act=accept]');
      await D.wait(500); await D.click('[data-act=publish]'); await D.click('#pbGo');
      await D.find('#pbEx', 10000); await D.wait(800); await D.click('#pbEx'); await D.wait(1500);
    } }
];

const Guide = {
  cur: 0,
  init() {
    $('#gSteps').innerHTML = STEPS.map((s, i) => `<button data-gs="${i}"><b>${i + 1}</b>${s.t}</button>`).join('');
    $('#gSteps').onclick = e => { const b = e.target.closest('[data-gs]'); if (b && !Director.running) { this.cur = +b.dataset.gs; this.refresh(); } };
    $('#guide').addEventListener('click', e => {
      const b = e.target.closest('[data-g]'); if (!b) return;
      ({ play: () => this.play(), jump: () => this.jump(this.cur), next: () => { if (this.cur < STEPS.length - 1) { this.cur++; this.refresh(); } }, reset: () => this.reset(), min: () => this.toggleMin() })[b.dataset.g]?.();
    });
    $('[data-g=stop]').onclick = () => Director.stop();
    $$('[data-speed]').forEach(b => b.onclick = () => { Director.speed = +b.dataset.speed; $$('[data-speed]').forEach(x => x.classList.toggle('on', x === b)); });
    this.refresh();
  },
  refresh() {
    const s = STEPS[this.cur]; if (!s) return;
    $$('#gSteps button').forEach((b, i) => { b.classList.toggle('on', i === this.cur); b.classList.toggle('done', i !== this.cur && STEPS[i].done()); });
    $('#gTitle').textContent = `${this.cur + 1}. ${s.t}`; $('#gDesc').textContent = s.d;
    $('#gPath').innerHTML = '메뉴 경로 ' + s.p.map(x => `<span>${esc(x)}</span>`).join(' › ');
    const p = $('#gPlay'); p.disabled = Director.running; p.textContent = s.done() && this.cur !== 5 && this.cur !== 7 ? '↻ 다시 보기' : '▶ 자동 실행';
  },
  ensureBefore(k) { let changed = false; for (let i = 0; i < k; i++) if (!STEPS[i].done() || (i === 2 && !S.flags.layout)) { STEPS[i].apply(); changed = true; } return changed; },
  async play() {
    const k = this.cur, s = STEPS[k];
    closeModal(); closeDrawer(); closeCtx();
    if (UI.tab !== 'model') switchTab('model');
    if (s.done() && ![2, 5, 7].includes(k)) { // 이미 완료된 단계는 직전 상태로 되돌린 뒤 다시 보여 준다
      this.rebuild(k);
    } else if (this.ensureBefore(k)) { commit(() => {}); }
    await Director.run(s.run.bind(s), `${k + 1}단계`);
    if (!Director.aborted && s.done() && k < STEPS.length - 1) { this.cur = k + 1; this.refresh(); }
  },
  rebuild(k) { // 빈 상태에서 0..k-1 단계를 적용
    hist.past.push(snap()); hist.future = [];
    Object.assign(S, { classes: [], rels: [], resources: [], mappings: [], pending: null, published: null, flags: {}, voiceLog: [] });
    for (let i = 0; i < k; i++) STEPS[i].apply();
    UI.sel = null; UI.mapSel = null; openVoice(S.mappings.length > 0); saving(); renderAll(); fitView();
  },
  jump(k) {
    if (Director.running) return;
    closeModal(); closeDrawer(); closeCtx(); switchTab('model');
    this.rebuild(k + 1);
    if (k === 7) { UI.mapSel = S.mappings.find(x => res(x.res)?.name === 'MOVIE_CREDIT')?.id; switchTab('mapping'); }
    if (k === 8) openExplorer();
    toast(`${k + 1}단계가 끝난 상태로 이동했습니다.`);
  },
  reset() {
    if (Director.running) return;
    closeModal(); closeDrawer(); closeCtx(); openVoice(false);
    hist.past.push(snap()); hist.future = [];
    Object.assign(S, { classes: [], rels: [], resources: [], mappings: [], questions: [], pending: null, published: null, flags: {}, voiceLog: [] });
    UI.sel = null; UI.mapSel = null; UI.vx = 0; UI.vy = 0; UI.k = 1; this.cur = 0; switchTab('model'); saving(); renderAll();
  },
  toggleMin() { const g = $('#guide'); g.classList.toggle('min'); $('#gMin').textContent = g.classList.contains('min') ? '펼치기' : '접기'; setTimeout(renderCanvas, 0); }
};
window.Guide = Guide;

/* 시작 */
Guide.init();
renderAll();
