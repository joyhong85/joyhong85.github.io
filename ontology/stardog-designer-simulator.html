<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stardog Designer 시뮬레이터: MOVA 온톨로지 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --ink:#1C1F26; --ink-2:#4A5160; --muted:#8A919E; --line:#E3E6EB; --line-2:#D3D8E0;
  --panel:#FFFFFF; --canvas:#EEF1F6; --grid:#DDE2EA; --field:#E8E9EB; --field-2:#F3F4F6;
  --green:#8BE36B; --green-ink:#1E3B12; --green-2:#71CF4F;
  --blue:#2C6BD3; --blue-soft:#D6E4FA; --red:#E04848; --red-soft:#F7C9C3;
  --dark:#1F242E;
  --guide:#151A24; --guide-2:#232A38; --guide-ink:#EDF1F7; --guide-muted:#9AA4B6; --guide-accent:#8BE36B;
  --sans:"Inter","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--panel);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:inherit}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{display:flex;flex-direction:column;height:100%}
#top{height:50px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel);position:relative;z-index:30}
#top .left,#top .right{display:flex;align-items:center;gap:10px}
#top .right{justify-content:flex-end}
.iconbtn{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{background:var(--field-2)}
.iconbtn.round{border-radius:50%}
#projName{font-weight:600;font-size:14px;padding:4px 6px;border-radius:6px;cursor:text;border:1px solid transparent;background:none}
#projName:hover{border-color:var(--line)}
#saveState{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px}
#saveState .spin{width:12px;height:12px;border:1.6px solid var(--muted);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs-top{display:flex;gap:4px;height:50px}
.tabs-top button{display:flex;align-items:center;gap:7px;padding:0 14px;border:0;background:none;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;font-size:13px}
.tabs-top button.on{color:var(--ink);border-bottom-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 13px;border-radius:7px;border:1px solid transparent;background:var(--field);cursor:pointer;font-weight:500;font-size:12.5px;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.green{background:var(--green);color:var(--green-ink);font-weight:600}
.btn.green.soft{background:#C9F0B8;color:#5E8A4B}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.plain{background:transparent}
.btn.red{background:transparent;color:var(--red);border-color:var(--line)}
.btn.dark{background:var(--dark);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.btn .spin{width:12px;height:12px;border:1.6px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}

#main{flex:1;min-height:0;display:flex;position:relative}
#side{width:250px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;position:relative;z-index:5}
#side .search{margin:12px 12px 6px;display:flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:7px;padding:0 9px;height:32px;color:var(--muted)}
#side .search input{border:0;outline:0;flex:1;min-width:0;background:none;font-size:12.5px}
.sec{border-bottom:1px solid var(--line)}
.sec-h{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;user-select:none}
.sec-h .chev{width:18px;height:18px;border:1px solid var(--line-2);border-radius:50%;display:grid;place-items:center;color:var(--ink-2);transition:transform .15s}
.sec.closed .chev{transform:rotate(-90deg)}
.sec-h b{font-weight:500;font-size:13px}
.sec-h .cnt{font-size:11px;color:var(--muted);background:var(--field-2);border-radius:4px;padding:0 5px}
.sec-h .add{margin-left:auto}
.sec-b{padding:0 10px 10px}
.sec.closed .sec-b{display:none}
.item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;background:var(--field-2);margin-bottom:5px;font-size:12px;cursor:pointer}
.item:hover{background:var(--field)}
.item .x{margin-left:auto;opacity:0;border:0;background:none;cursor:pointer;color:var(--muted)}
.item:hover .x{opacity:1}
.qinput{display:flex;gap:6px;margin-bottom:6px}
.qinput input{flex:1;min-width:0;height:30px;border:1px solid var(--line-2);border-radius:6px;padding:0 8px;font-size:12px}
.tree{padding:0 6px}
.tree .t{display:flex;align-items:center;gap:6px;padding:6px 6px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.tree .t:hover{background:var(--field-2)}
.tree .t.on{background:var(--field);color:var(--ink);font-weight:500}
.tree .t.l1{padding-left:22px}.tree .t.l2{padding-left:38px}
.side-fill{flex:1}
.side-empty{color:var(--muted);font-size:12px;padding:4px 4px 10px}

/* voicebox */
#voice{position:absolute;inset:0;background:#FAFBFB;display:none;flex-direction:column;z-index:6;border-right:1px solid var(--line)}
#voice.on{display:flex}
#voice .vh{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 10px}
.vlogo{letter-spacing:.14em;font-size:15px;color:#7B828F;font-weight:500}
.vsum{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
.vsum b{font-weight:500}
.vsum .badge{margin-left:auto;display:flex;align-items:center;gap:4px;background:#FCE3E1;color:var(--red);border-radius:5px;padding:1px 6px;font-size:11px}
.vsum .badge i{width:8px;height:8px;border-radius:50%;background:var(--red);display:block}
.vlog{flex:1;overflow:auto;padding:12px 12px 6px}
.vintro{color:#A3A9B3;font-size:12.5px;line-height:1.6;margin:30px 4px 10px;font-family:Georgia,serif}
.vmsg{display:flex;gap:9px;align-items:flex-start;margin:14px 0;font-size:12px;color:var(--ink-2);line-height:1.5}
.vmsg .av{width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:none;font-size:10px}
.vmsg.me{justify-content:flex-end}
.vmsg.me span{background:var(--dark);color:#fff;border-radius:10px;padding:6px 10px;max-width:85%}
.vsep{text-align:center;margin:12px 0;position:relative}
.vsep span{position:relative;background:#FAFBFB;padding:2px 8px;font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:5px}
.vsep::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--line)}
.vin{padding:8px 12px 12px}
.vchips{display:flex;gap:6px;margin-bottom:7px}
.vchips button{background:#3B4250;color:#fff;border:0;border-radius:6px;font-size:11px;padding:3px 8px;cursor:pointer;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.vbox textarea{border:0;outline:0;resize:none;height:44px;font-size:12.5px}
.vbox .send{align-self:flex-end;width:32px;height:32px;border-radius:50%;border:0;background:var(--green);display:grid;place-items:center;cursor:pointer}

/* canvas */
#center{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
#canvasWrap{flex:1;position:relative;overflow:hidden;background-color:var(--canvas);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none}
#svg.panning{cursor:grabbing}
.ctool{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:flex-start;gap:12px;pointer-events:none;z-index:4}
.ctool>*{pointer-events:auto}
.modelpick{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;height:36px;padding:0 6px 0 8px;min-width:200px}
.modelpick .lab{color:var(--muted)}
.modelpick b{font-weight:500;margin-right:auto}
.tb{display:flex;align-items:center;gap:2px;height:36px}
.tb button{width:30px;height:30px;border:0;border-radius:7px;background:none;cursor:pointer;display:grid;place-items:center;color:var(--ink-2);position:relative}
.tb button:hover{background:rgba(0,0,0,.06)}
.tb button[disabled]{opacity:.35;cursor:default;background:none}
.tb button.on{background:var(--blue-soft);color:var(--blue)}
.tip{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.08);border-radius:5px;padding:3px 7px;font-size:11px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;color:var(--ink)}
.tb button:hover .tip,.tb button.showtip .tip{opacity:1}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.tb-right .rules{display:flex;align-items:center;gap:5px;border:0;background:none;cursor:pointer;font-weight:500;font-size:12px;height:30px;padding:0 6px;border-radius:6px}
.tb-right .rules:hover{background:rgba(0,0,0,.06)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;background:var(--panel);overflow:hidden}
.seg button{width:30px;height:28px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--field);color:var(--ink)}
.csearch{height:30px;border:1px solid var(--line-2);border-radius:7px;padding:0 9px;width:170px;background:#fff;display:none}
.csearch.on{display:block}
.legend{position:absolute;top:52px;left:10px;display:none;flex-direction:column;gap:5px;z-index:4}
.legend.on{display:flex}
.legend span{font-size:11px;border-radius:999px;padding:2px 9px;width:max-content;border:1.5px solid}
.legend .c{background:var(--blue-soft);border-color:#7EA5E6;color:#24508F}
.legend .d{background:#F49B8D;border-color:#E06C5A;color:#7A2418}
#vbtn{position:absolute;left:14px;bottom:14px;width:40px;height:40px;border-radius:50%;background:var(--green);border:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 10px rgba(80,160,60,.35);z-index:4}
#vbtn .n{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.empty-hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#9AA2AF;font-size:13px;text-align:center;line-height:1.7}

/* svg graph */
.node{cursor:pointer}
.node circle.b{stroke:#555B66;stroke-width:2.2}
.node.sel circle.b{stroke:#1C1F26;stroke-width:3.2}
.node text.n{font-weight:600;font-size:13px;fill:#1C1F26;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node.dim{opacity:.25}
.node .badge rect{fill:#fff;stroke:#C9CED6}
.node .badge text{font-size:11px;font-weight:600;text-anchor:middle;dominant-baseline:central;fill:#1C1F26}
.edge path.l{fill:none;stroke:#5B616C;stroke-width:1.6}
.edge.sel path.l{stroke:#1C1F26;stroke-width:3}
.edge path.hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.edge text{font-size:12.5px;font-weight:600;fill:#3A404B;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--canvas);stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.edge.sel text{fill:#1C1F26}
.edge.sub path.l{stroke-dasharray:3 4}
.mapedge path{fill:none;stroke:#2C2F36;stroke-width:2;stroke-dasharray:8 6}
.mapedge text{font-size:12px;font-weight:600;fill:#2C2F36;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--canvas);stroke-width:5px}
.mapedge.pending path{stroke:#4D8EE8}
.mapedge.pending rect{fill:var(--blue-soft);stroke:#7EA5E6}
.mapedge.pending text{stroke:none;fill:#24508F;font-weight:500}
.res{cursor:pointer}
.res path.f{fill:#fff;stroke:#1C1F26;stroke-width:2.4;stroke-linejoin:round}
.res text{font-size:11.5px;font-weight:600;text-anchor:middle;fill:#1C1F26}
.res.sel path.f{fill:#E6EEFB}
.res.dim{opacity:.25}
.drop-ghost{fill:none;stroke:#2C6BD3;stroke-width:2;stroke-dasharray:5 4}

/* context menu */
.ctx{position:fixed;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:4px;min-width:150px;z-index:60;font-size:12.5px}
.ctx .tag{position:absolute;left:-2px;top:-26px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-size:11px;white-space:nowrap}
.ctx button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:5px;cursor:pointer}
.ctx button:hover{background:var(--field-2)}
.ctx .hd{padding:5px 10px;color:var(--muted);font-size:11px}
.ctx button.danger{color:var(--red)}

/* drawer */
#dim{position:absolute;inset:0;background:rgba(40,42,48,.55);z-index:20;display:none}
#dim.on{display:block}
#drawer{position:absolute;top:0;right:0;bottom:0;width:min(470px,100%);background:#fff;box-shadow:-10px 0 30px rgba(0,0,0,.12);z-index:25;display:none;flex-direction:column}
#drawer.on{display:flex}
#drawer.float{top:12px;right:12px;bottom:12px;border-radius:12px}
.dr-h{display:flex;align-items:center;gap:10px;padding:14px 16px 12px}
.dr-h h3{margin:0;font-size:15px;font-weight:500;flex:1}
.dr-h .x,.mod-h .x{border:0;background:none;cursor:pointer;font-size:18px;line-height:1;color:var(--ink-2);width:26px;height:26px;border-radius:6px}
.dr-h .x:hover{background:var(--field-2)}
.dtabs{display:flex;gap:16px;padding:0 16px;border-bottom:1px solid var(--line)}
.dtabs button{border:0;background:none;padding:6px 0 8px;cursor:pointer;font-size:12.5px;color:var(--ink-2);border-bottom:2px solid transparent}
.dtabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.dr-b{flex:1;overflow:auto;padding:14px 16px}
.dr-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.dr-f .sp{flex:1}
.fl{display:block;font-size:12px;color:var(--ink-2);margin:0 0 5px}
.fl+.fi{margin-bottom:0}
.frow{display:flex;align-items:center;gap:10px;margin-bottom:14px;position:relative}
.fi{width:100%;height:34px;border:1px solid transparent;background:var(--field);border-radius:5px;padding:0 10px;outline:0;margin-bottom:14px}
.fi:focus{border-color:#7EA5E6;background:#fff;box-shadow:0 0 0 3px rgba(44,107,211,.12)}
textarea.fi{height:64px;padding:8px 10px;resize:vertical}
.frow .fi{margin-bottom:0}
.cdot{width:14px;height:14px;border-radius:50%;flex:none;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-2)}
.err{position:absolute;right:30px;top:38px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.1);border-radius:5px;padding:4px 8px;font-size:11px;color:var(--red);z-index:3}
.note{background:var(--field-2);border-radius:7px;padding:10px 12px;color:var(--ink-2);font-size:12px;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chiplist{margin:6px 0 0;padding:0;list-style:none}
.chiplist li{display:flex;justify-content:space-between;align-items:center;padding:4px 4px;font-size:12px;max-width:190px}
.chiplist li button{border:0;background:none;cursor:pointer;color:var(--ink-2)}
table.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:14px}
table.tbl th{text-align:left;font-weight:600;padding:7px 8px;border:1px solid var(--line);background:#FAFAFB}
table.tbl td{padding:7px 8px;border:1px solid var(--line)}
table.tbl td .lnk{color:var(--blue);cursor:pointer}
.attrhead{display:grid;grid-template-columns:1.3fr 1fr .8fr 40px;gap:8px;align-items:center;font-size:12px;font-weight:600;padding:7px 8px;border:1px solid var(--line);background:#FAFAFB}
.attrrow{display:grid;grid-template-columns:1.3fr 1fr .8fr 40px;gap:8px;align-items:center;font-size:12px;padding:7px 8px;border:1px solid var(--line);border-top:0}
.attrrow .nm{color:var(--blue)}
.attrrow select{height:26px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:11.5px;max-width:100%}
.attrrow .del{border:0;background:none;color:var(--muted);cursor:pointer;justify-self:end}
.attradd{display:grid;grid-template-columns:1.3fr 1fr .8fr 40px;gap:8px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-top:0}
.addlink{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;justify-self:end}
.addlink.on{color:var(--ink);font-weight:600}

/* combobox */
.combo{position:relative;width:100%}
.combo-btn{width:100%;height:30px;display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid transparent;background:var(--field);border-radius:5px;padding:0 9px;cursor:pointer;text-align:left;font-size:12px}
.combo-btn .ph{color:var(--muted)}
.combo-btn .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.combo-pop{position:absolute;left:0;top:calc(100% + 3px);min-width:100%;width:max-content;max-width:280px;background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 8px 22px rgba(0,0,0,.12);z-index:70;display:none;padding:4px}
.combo.open .combo-pop{display:block}
.combo-pop .cs{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:5px;padding:0 7px;height:28px;margin-bottom:4px;color:var(--muted)}
.combo-pop .cs input{border:0;outline:0;flex:1;min-width:120px;font-size:12px;color:var(--ink)}
.combo-pop ul{list-style:none;margin:0;padding:0;max-height:210px;overflow:auto}
.combo-pop li{padding:6px 8px;border-radius:5px;cursor:pointer;font-size:12px;white-space:nowrap}
.combo-pop li:hover,.combo-pop li.act{background:var(--blue-soft)}
.combo-pop li.create{color:var(--blue)}
.combo-pop li.none{color:var(--muted);cursor:default;background:none}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:34px;border:1px solid var(--line-2);border-radius:5px;padding:4px 6px;background:#fff;cursor:text;position:relative}
.chips .chip{background:#5A6170;color:#fff;font-size:11px;border-radius:4px;padding:2px 4px 2px 7px;display:flex;align-items:center;gap:4px}
.chips .chip button{border:0;background:none;color:#fff;cursor:pointer;padding:0 2px;font-size:12px;line-height:1}
.chips .ph{color:var(--muted);font-size:12px;padding-left:4px}

/* modal */
#modalLayer{position:fixed;inset:0;background:rgba(40,42,48,.55);z-index:80;display:none;place-items:center;padding:20px}
#modalLayer.on{display:grid}
.mod{background:#fff;border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:min(520px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}
.mod-h{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--dark);color:#fff}
.mod-h h3{margin:0;font-size:14px;font-weight:600}
.mod-h .x{color:#fff}
.mod-h.light{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
.mod-h.light .x{color:var(--ink-2)}
.mod-b{padding:16px 18px;overflow:auto}
.mod-b h4{margin:0 0 3px;font-size:13px;font-weight:600}
.mod-b .sub{font-size:11.5px;color:var(--muted);margin:0 0 6px}
.mod-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px}
.mod.wide{width:min(1180px,100%);height:min(720px,calc(100vh - 40px))}

/* preview */
.pv{display:grid;grid-template-columns:300px 1fr;min-height:0;flex:1}
.pv-l{border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;overflow:auto;background:#FBFBFC}
.pv-r{padding:14px 16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pv-r .meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;color:var(--ink-2)}
.pv-r .meta .chip{background:var(--field);border-radius:999px;padding:2px 8px;font-size:11px}
.pv-tbl{overflow:auto;border:1px solid var(--line);border-radius:6px;flex:1}
.pv-tbl table{border-collapse:collapse;font-size:12px;min-width:100%}
.pv-tbl th{position:sticky;top:0;background:#F4F5F7;text-align:left;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
.pv-tbl th small{display:block;font-weight:400;color:var(--muted);font-size:10.5px;margin-top:3px;line-height:1.4}
.pv-tbl td{padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tog{display:flex;align-items:center;gap:9px;font-size:12px;margin:6px 0;cursor:pointer}
.tog i{width:30px;height:17px;border-radius:999px;background:#C8CDD5;position:relative;display:block;transition:background .15s}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on i{background:#3B4250}
.tog.on i::after{left:15px}

/* add data */
.dz{border:2px dashed #9EDB86;border-radius:10px;padding:26px 16px;text-align:center;color:var(--ink-2);font-size:12.5px;background:#FCFEFB;transition:background .15s}
.dz.over{background:#EEF9E8}
.dz .up{color:#79C95B;margin-bottom:6px}
.dz .small{display:block;margin-top:10px;font-size:11.5px;color:var(--muted)}
.dz .small button{border:0;background:none;color:var(--blue);cursor:pointer;font-size:11.5px;padding:0}
.srcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.srcgrid button{border:0;background:var(--field-2);border-radius:8px;padding:12px 10px;text-align:left;cursor:pointer;font-size:12px;display:flex;flex-direction:column;gap:8px;min-height:74px}
.srcgrid button:hover{background:var(--field)}
.srcgrid .ic{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
.dsec{font-size:13px;font-weight:500;margin:18px 0 0}
.fcard{background:var(--field-2);border-radius:8px;padding:10px 12px;margin-top:10px}
.fcard .fh{display:flex;align-items:center;gap:8px;font-weight:500;font-size:12.5px}
.fcard .fh .acts{margin-left:auto;display:flex;gap:4px}
.fcard .fh .acts button{width:24px;height:24px;border-radius:50%;border:1px solid var(--line-2);background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.fcard p{margin:6px 0 0;font-size:11.5px;color:var(--ink-2);line-height:1.5}

/* file picker */
.fp{width:min(720px,100%);border-radius:12px;background:#F6F6F7}
.fp-top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #E1E1E3}
.fp-top .path{margin:0 auto;background:#fff;border:1px solid #DADADD;border-radius:6px;padding:3px 10px;font-size:12px;display:flex;align-items:center;gap:6px}
.fp-body{display:grid;grid-template-columns:150px 1fr;height:330px}
.fp-side{border-right:1px solid #E1E1E3;padding:10px 8px;font-size:12px;color:#4A4A4F}
.fp-side div{padding:5px 8px;border-radius:5px}
.fp-side div.on{background:#E1E1E5}
.fp-side small{display:block;color:#9A9AA0;font-size:10.5px;margin:10px 8px 2px}
.fp-list{overflow:auto;background:#fff}
.fp-list table{width:100%;border-collapse:collapse;font-size:12px}
.fp-list th{text-align:left;font-weight:500;color:#8A8A90;padding:6px 10px;border-bottom:1px solid #EEE;font-size:11px;position:sticky;top:0;background:#fff}
.fp-list td{padding:5px 10px;white-space:nowrap;cursor:default}
.fp-list tr.f:nth-child(even) td{background:#F7F7F9}
.fp-list tr.f.on td{background:#2F6FE0;color:#fff}
.fp-list tr.dis td{color:#BBB}
.fp-list .ficon{display:inline-block;width:11px;height:13px;background:#3DAF5B;border-radius:2px;margin-right:7px;vertical-align:-2px}
.fp-list tr.dis .ficon{background:#CCC}
.fp-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid #E1E1E3}

/* mapping view */
#mapView{position:absolute;inset:0;background:#fff;display:none;flex-direction:column;z-index:10}
#mapView.on{display:flex}
.mv-empty{flex:1;display:grid;place-items:center;color:var(--ink-2)}
.mv{flex:1;overflow:auto}
.mv-grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(320px,1.2fr);min-width:620px}
.mv-grid>div{border-bottom:1px solid var(--line);padding:12px 16px;min-height:52px;display:flex;flex-direction:column;justify-content:center}
.mv-grid>.lc{border-right:1px solid var(--line)}
.mv-grid .hd{background:#ECEDEF;font-weight:600;min-height:62px}
.mv-grid .hd small{font-weight:400;color:var(--blue);margin-top:2px}
.mv-grid .hd.r small{color:var(--ink-2)}
.mv-grid .hdrow{flex-direction:row;align-items:center;justify-content:space-between;gap:8px}
.mv-grid .sec2{grid-column:1/-1;background:#ECEDEF;font-weight:500;flex-direction:row;align-items:center;gap:6px;min-height:36px;padding:8px 16px;border-right:0!important}
.mv-grid .rname{flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;color:var(--blue)}
.mv-grid .lab{flex-direction:row;align-items:center;justify-content:flex-start;gap:8px}
.mv-grid .aname{flex-direction:row;align-items:center;justify-content:flex-start;gap:8px}
.mv-grid .aname .sq{width:10px;height:10px;background:#1C1F26;border-radius:2px}
.mv-grid .aname .nm{color:var(--blue)}
.mv-grid .aname .ty{margin-left:auto;color:var(--ink-2);font-size:12px}
.mv-grid .pv2{font-size:11.5px;color:var(--ink-2);margin-top:5px}
.mv-grid .pair{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
.mv-grid .pair label{font-size:11px;color:var(--ink-2);display:block;margin-bottom:4px}
.mv-grid .combo{max-width:240px}
.mv-grid .chips{min-height:30px}
.code{background:#1A2130;color:#DCE3F0;font:12px/1.65 ui-monospace,Menlo,Consolas,monospace;padding:14px 16px;border-radius:8px;white-space:pre;overflow:auto;margin:0}
.code .k{color:#C3A6FF}.code .s{color:#F2C47A}.code .c{color:#7C8AA5}.code .i{color:#7FDCCF}

/* banner + guide */
#banner{flex:none;background:#0F131B;color:#E4E8EF;display:none;align-items:center;justify-content:center;gap:10px;height:40px;font-size:12px;position:relative;z-index:12}
#banner.on{display:flex}
#banner .acts{position:absolute;right:12px;display:flex;gap:6px}
#banner .btn{height:26px}
#guide{flex:none;background:var(--guide);color:var(--guide-ink);display:flex;flex-direction:column;z-index:40;position:relative}
#guide.min .g-body{display:none}
.g-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #263043}
.g-bar .ttl{font-weight:600;font-size:12.5px;color:var(--guide-accent);white-space:nowrap}
.g-steps{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.g-steps button{flex:none;border:1px solid #2E3850;background:none;color:var(--guide-muted);border-radius:999px;height:26px;padding:0 10px;cursor:pointer;font-size:11.5px;display:flex;align-items:center;gap:6px}
.g-steps button b{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:#2A3346;color:var(--guide-ink);font-size:10px}
.g-steps button.on{border-color:var(--guide-accent);color:var(--guide-ink)}
.g-steps button.on b{background:var(--guide-accent);color:#152112}
.g-steps button.done b{background:#3C6B2D;color:#DFF5D4}
.g-bar .gbtn{border:1px solid #2E3850;background:none;color:var(--guide-ink);height:26px;border-radius:6px;padding:0 9px;cursor:pointer;font-size:11.5px;white-space:nowrap}
.g-bar .gbtn:hover{background:var(--guide-2)}
.g-body{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:12px 16px 14px;align-items:center}
.g-body h4{margin:0 0 4px;font-size:15px;font-weight:600}
.g-body p{margin:0;color:#C9D1DE;font-size:12.5px;line-height:1.6;max-width:820px}
.g-body .path{margin-top:6px;font-size:11.5px;color:var(--guide-muted)}
.g-body .path span{color:var(--guide-ink);background:var(--guide-2);border-radius:4px;padding:1px 6px;margin:0 2px;white-space:nowrap}
.g-acts{display:flex;gap:8px;align-items:center}
.g-acts button{height:34px;border-radius:8px;padding:0 14px;cursor:pointer;font-weight:600;font-size:12.5px;border:1px solid #2E3850;background:var(--guide-2);color:var(--guide-ink);white-space:nowrap}
.g-acts button.play{background:var(--guide-accent);color:#142010;border-color:var(--guide-accent)}
.g-acts button.stop{background:#E04848;border-color:#E04848;color:#fff}
.g-acts .speed{display:flex;border:1px solid #2E3850;border-radius:8px;overflow:hidden}
.g-acts .speed button{border:0;border-radius:0;height:32px;padding:0 9px;background:none;color:var(--guide-muted);font-weight:500}
.g-acts .speed button.on{background:var(--guide-2);color:var(--guide-ink)}

/* director */
#ghost{position:fixed;left:0;top:0;width:22px;height:22px;z-index:200;pointer-events:none;display:none;transition:transform .5s cubic-bezier(.4,.1,.2,1)}
#ghost.on{display:block}
#ghost svg{filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.ripple{position:fixed;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid #2C6BD3;z-index:199;pointer-events:none;animation:rip .5s ease-out forwards}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
#shield{position:fixed;inset:0;z-index:150;display:none;cursor:not-allowed}
#shield.on{display:block}
.runbadge{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#151A24;color:#fff;border-radius:999px;padding:6px 14px;font-size:12px;z-index:210;display:none;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.runbadge.on{display:flex}
.runbadge i{width:8px;height:8px;border-radius:50%;background:#E04848;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

/* toast */
#toasts{position:fixed;top:62px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:220}
.toast{background:#1F242E;color:#fff;padding:9px 14px;border-radius:8px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:340px;animation:tin .2s ease-out}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}

/* publish + explorer */
.pubsteps{list-style:none;padding:0;margin:12px 0 0}
.pubsteps li{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px;color:var(--muted)}
.pubsteps li i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);display:block;flex:none}
.pubsteps li.run{color:var(--ink)}
.pubsteps li.run i{border-color:var(--blue);border-right-color:transparent;animation:spin .7s linear infinite}
.pubsteps li.ok{color:var(--ink)}
.pubsteps li.ok i{border-color:#5DBB3C;background:#5DBB3C}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--field-2);border-radius:8px;padding:10px}
.stats b{display:block;font-size:20px;font-weight:600}
.stats span{font-size:11px;color:var(--ink-2)}
.ex{display:grid;grid-template-columns:1fr 300px;flex:1;min-height:0}
.ex-g{position:relative;background:#F6F8FB;overflow:hidden}
.ex-g svg{width:100%;height:100%}
.ex-p{border-left:1px solid var(--line);padding:16px;overflow:auto}
.ex-p h4{margin:0 0 2px;font-size:16px}
.ex-p .cls{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;margin-bottom:10px;color:#1C1F26}
.ex-p dl{margin:0;font-size:12px}
.ex-p dt{color:var(--muted);margin-top:8px}
.ex-p dd{margin:2px 0 0;word-break:break-all}
.ex-top{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.ex-top input{height:32px;border:1px solid var(--line-2);border-radius:7px;padding:0 10px;width:260px}
.ex-top .hint{color:var(--muted);font-size:11.5px}
.exn{cursor:pointer}
.exn circle{stroke:#454B56;stroke-width:1.6}
.exn.c circle{stroke-width:3;stroke:#1C1F26}
.exn text{font-size:11.5px;text-anchor:middle;fill:#1C1F26;font-weight:600;paint-order:stroke;stroke:#F6F8FB;stroke-width:4px}
.exe path{stroke:#9AA1AD;stroke-width:1.4;fill:none}
.exe text{font-size:10.5px;fill:#5B616C;text-anchor:middle;paint-order:stroke;stroke:#F6F8FB;stroke-width:4px}

/* list view */
#listView{position:absolute;inset:56px 10px 10px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;display:none;z-index:3}
#listView.on{display:block}
#listView table{width:100%;border-collapse:collapse;font-size:12.5px}
#listView th{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:#FAFAFB;position:sticky;top:0}
#listView td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
#listView .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:-1px}

@media (max-width:820px){
  #side{width:200px}
  .g-body{grid-template-columns:1fr}
  .modelpick{min-width:0}
}
@media (prefers-reduced-motion:reduce){#ghost{transition:none}.ripple{animation:none;display:none}}

</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="left">
      <button class="iconbtn round" title="프로젝트 목록" data-act="back"><svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <button id="projName" title="이름 바꾸기">MOVA</button>
      <span id="saveState"><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M7 18a5 5 0 0 1-.5-9.97A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/></svg><span>Saved to Cloud</span><span> * 이 페이지는 <a href="https://cloud.stardog.com/" target="_blank">Stardog</a>을 참조한 데모입니다.</span></span>
    </div>
    <nav class="tabs-top">
      <button class="on" data-tab="model"><svg class="i" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></svg>Data Model</button>
      <button data-tab="mapping"><svg class="i" viewBox="0 0 24 24"><path d="M5 4v12h6M5 10h6"/><rect x="13" y="13" width="6" height="6" rx="1"/><rect x="13" y="7" width="6" height="6" rx="1"/></svg>Mapping</button>
    </nav>
    <div class="right">
      <button class="iconbtn" data-act="more" title="더 보기"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
      <button class="btn green" data-act="publish">Publish</button>
    </div>
  </header>

  <div id="main">
    <aside id="side">
      <div id="sideModel" style="display:flex;flex-direction:column;flex:1;min-height:0">
        <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg><input id="sideSearch" placeholder="Search"></label>
        <div class="sec" id="secMappings" style="display:none">
          <div class="sec-h"><span class="chev"><svg class="i" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M6 9l6 6 6-6"/></svg></span><b>Mappings</b><button class="iconbtn round add" data-act="new-mapping" title="New Mapping" style="width:24px;height:24px"><svg class="i" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="M12 5v14M5 12h14"/></svg></button></div>
          <div class="sec-b"><div class="tree" id="mapTree"></div></div>
        </div>
        <div class="side-fill" id="sideFill" style="display:none"></div>
        <div class="sec" id="secQ">
          <div class="sec-h"><span class="chev"><svg class="i" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M6 9l6 6 6-6"/></svg></span><b>Questions</b><span class="cnt" id="qCount">0</span><button class="iconbtn round add" data-act="add-question" title="질문 추가" style="width:24px;height:24px"><svg class="i" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="M12 5v14M5 12h14"/></svg></button></div>
          <div class="sec-b" id="qList"></div>
        </div>
        <div class="sec" id="secR">
          <div class="sec-h"><span class="chev"><svg class="i" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M6 9l6 6 6-6"/></svg></span><b>Resources</b><span class="cnt" id="rCount">0</span><button class="iconbtn round add" data-act="add-data" title="Add data" style="width:24px;height:24px"><svg class="i" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="M12 5v14M5 12h14"/></svg></button></div>
          <div class="sec-b" id="rList"></div>
        </div>
      </div>
      <div id="voice">
        <div class="vh"><span class="vlogo">VOICEB<svg viewBox="0 0 24 24" style="width:15px;height:15px;vertical-align:-2px;fill:#3B4250"><path d="M4 9a3 3 0 0 1 3-3h7l3-2v4a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/></svg>X</span><button class="iconbtn" data-act="close-voice" title="닫기"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="vsum"><svg class="i" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="M6 9l6 6 6-6"/></svg><b>Model Summary</b><span class="badge" id="vBadge"><i></i><span>0</span></span></div>
        <div class="vlog" id="vLog"></div>
        <div class="vin">
          <div class="vchips"><button data-vchip="Credit 클래스에 어떤 속성이 있나요?">Credit 클래스에 어떤 속성이…</button><button data-vchip="Genre 클래스를 추가해줘">Genre 클래스를…</button></div>
          <div class="vbox"><textarea id="vInput" placeholder="Ask Voicebox"></textarea><button class="send" data-act="vsend" aria-label="보내기"><svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:#1E3B12"><path d="M6 4l14 8-14 8z"/></svg></button></div>
        </div>
      </div>
    </aside>

    <section id="center">
      <div id="canvasWrap">
        <svg id="svg">
          <defs>
            <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#5B616C"/></marker>
            <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1C1F26"/></marker>
            <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#2C2F36"/></marker>
            <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4D8EE8"/></marker>
            <marker id="arrH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#fff" stroke="#5B616C"/></marker>
          </defs>
          <g id="world"></g>
        </svg>
        <div class="empty-hint" id="emptyHint">빈 모델입니다.<br>툴바의 <b>● Add class</b>로 첫 클래스를 만들거나, 아래 가이드의 <b>자동 실행</b>을 눌러 보세요.</div>
        <div class="ctool">

const clsByName = n => S.classes.find(c => c.name.toLowerCase() === String(n).toLowerCase());
const res = id => S.resources.find(r => r.id === id);
const resByName = n => S.resources.find(r => r.name.toLowerCase() === String(n).toLowerCase());
const relById = id => S.rels.find(r => r.id === id);
const relByName = n => S.rels.find(r => r.name === n);
const attrById = (c, id) => c.attrs.find(a => a.id === id);

function nextClassPos() {
  const vp = viewCenter();
  const n = S.classes.length;
  return { x: vp.x + 180, y: vp.y - 170 + (n % 5) * 95 };
}
function addClass(name, desc = '', extra = {}) {
  const c = { id: uid('c'), name, desc, color: COLORS[S.classes.length % COLORS.length], ...nextClassPos(), attrs: [], parent: null, geo: false, ...extra };
  S.classes.push(c); return c;
}
function addRel(name, pairs, desc = '') {
  let r = relByName(name);
  if (r) { pairs.forEach(p => { if (!r.pairs.some(q => q.s === p.s && q.t === p.t)) r.pairs.push(p); }); return r; }
  r = { id: uid('r'), name, desc, pairs }; S.rels.push(r); return r;
}
function addAttr(c, name, type = 'string', rule = '') {
  let a = c.attrs.find(x => x.name === name);
  if (a) { a.type = type; return a; }
  a = { id: uid('a'), name, type, rule }; c.attrs.push(a); return a;
}
function deleteClass(id) {
  S.classes = S.classes.filter(c => c.id !== id);
  S.classes.forEach(c => { if (c.parent === id) c.parent = null; });
  S.rels.forEach(r => r.pairs = r.pairs.filter(p => p.s !== id && p.t !== id));
  S.rels = S.rels.filter(r => r.pairs.length);
  S.mappings = S.mappings.filter(m => m.cls !== id);
  S.mappings.forEach(m => m.rels = m.rels.filter(x => x.target !== id));
}
function deleteResource(id) { S.resources = S.resources.filter(r => r.id !== id); S.mappings = S.mappings.filter(m => m.res !== id); }

/* 리소스 */
function inferType(vals) {
  const v = vals.filter(x => x !== '' && x != null);
  if (!v.length) return 'string';
  if (v.every(x => /^-?\d+$/.test(x))) return v.every(x => /^(1[89]|20)\d\d$/.test(x)) ? 'gYear' : 'integer';
  if (v.every(x => /^-?\d+(\.\d+)?$/.test(x))) return 'decimal';
  if (v.every(x => /^(Y|N|true|false)$/i.test(x))) return 'boolean';
  if (v.every(x => /^\d{4}-\d\d-\d\d$/.test(x))) return 'date';
  return 'string';
}
function makeResource(name, cols, rows) {
  const n = S.resources.length;
  const base = graphBounds();
  const free = S.resources.filter(r => !S.mappings.some(m => m.res === r.id)).length;
  return { id: uid('s'), name, file: name + '.csv', cols, rows, x: base.minX - 60 + free * 150, y: base.maxY + 170,
    props: { sep: ',', quote: '"', esc: '"', header: true, skip: true }, updated: new Date().toISOString() };
}
function describeRes(r) {
  return `The dataset contains ${r.cols.length} columns and ${r.rows.length} rows. Detected columns include ${r.cols.join(', ')}.`;
}

/* 매핑 제안 (Voicebox 역할) */
function pickCol(cols, cands) {
  for (const c of cands) { const f = cols.find(x => x === c); if (f) return f; }
  for (const c of cands) { const f = cols.find(x => x.endsWith(c)); if (f) return f; }
  for (const c of cands) { const f = cols.find(x => x.includes(c)); if (f) return f; }
  return null;
}
function idColFor(c, cols) {
  const s = snake(c.name);
  const own = S.mappings.find(m => m.cls === c.id);
  const cands = [s + '_id', s + '_cd', s + '_code'];
  if (own && own.primary[0]) cands.unshift(own.primary[0]);
  return pickCol(cols, cands);
}
function suggestMapping(r, c) {
  const cols = r.cols;
  const prim = idColFor(c, cols) || cols.find(x => /_(id|cd)$/.test(x)) || cols[0];
  const sn = snake(c.name);
  const label = cols.find(x => x === sn + '_title' || x === sn + '_name') || cols.find(x => x.startsWith(sn.split('_')[0] + '_') && /_(title|name)$/.test(x)) || prim;
  const rels = [];
  S.rels.forEach(rel => rel.pairs.filter(p => p.s === c.id).forEach(p => {
    const t = cls(p.t); if (!t) return;
    const col = idColFor(t, cols.filter(x => x !== prim));
    if (col) rels.push({ rel: rel.id, target: t.id, col });
  }));
  const attrs = [];
  c.attrs.forEach(a => { const s = snake(a.name); const col = pickCol(cols, [s, s.replace(/^.*_/, '')]); if (col) attrs.push({ attr: a.id, col }); });
  return { id: uid('m'), res: r.id, cls: c.id, primary: [prim], labelOn: true, label, rels, attrs, pending: true };
}
/* 클래스를 비워두면 리소스에서 클래스 개념을 만든다 */
function generateClassFrom(r) {
  let name = pascal(r.name.replace(/_(CODE|CD)$/i, '').replace(/^OTT_/i, ''));
  if (r.name.toUpperCase() === 'MOVIE_CREDIT') name = 'Credit';
  let c = clsByName(name);
  if (!c) {
    c = addClass(name, `${r.name}에서 생성됨`);
    r.cols.filter(x => !/_(id|cd)$/.test(x)).forEach(col => addAttr(c, col.replace(/_([a-z])/g, (_, ch) => ch.toUpperCase()), inferType(r.rows.slice(0, 30).map(row => row[col]))));
  }
  return c;
}

function beginPending() { if (!S.pending) S.pending = snap(); }
function createMappings(resIds, clsIds) {
  beginPending();
  const made = [];
  resIds.forEach(rid => {
    const r = res(rid);
    const targets = clsIds.length ? clsIds : [generateClassFrom(r).id];
    targets.forEach(cid => {
      S.mappings = S.mappings.filter(m => !(m.res === rid && m.cls === cid));
      const m = suggestMapping(r, cls(cid)); S.mappings.push(m); made.push(m);
      placeResource(r, cls(cid));
    });
  });
  S.voiceLog.push({ who: 'vb', text: 'Added suggested mappings.' });
  return made;
}
function placeResource(r, c) {
  const isSource = S.rels.some(x => x.pairs.some(p => p.s === c.id));
  if (isSource) { r.x = c.x - 30; r.y = c.y + 240; } else { r.x = c.x + 280; r.y = c.y + 10; }
}
function acceptChanges() { S.mappings.forEach(m => m.pending = false); S.pending = null; S.voiceLog.push({ sep: 'Accepted changes' }); }
function discardChanges() { if (!S.pending) return; const log = S.voiceLog; restore(S.pending); S.pending = null; S.voiceLog = log.concat({ sep: 'Discarded changes' }); }
const pendingCount = () => S.mappings.filter(m => m.pending).length;

/* 레이아웃: 관계 방향 기준 계층 배치 */
function redrawLayout() {
  const ids = S.classes.map(c => c.id);
  const out = {}, indeg = {};
  ids.forEach(i => { out[i] = []; indeg[i] = 0; });
  S.rels.forEach(r => r.pairs.forEach(p => { if (p.s !== p.t && out[p.s]) { out[p.s].push(p.t); indeg[p.t]++; } }));
  S.classes.forEach(c => { if (c.parent && out[c.parent]) { out[c.id].push(c.parent); indeg[c.parent]++; } });
  const layer = {}; ids.forEach(i => layer[i] = 0);
  for (let it = 0; it < ids.length; it++) ids.forEach(i => out[i].forEach(t => { if (layer[t] < layer[i] + 1 && layer[i] + 1 < ids.length) layer[t] = layer[i] + 1; }));
  const cols = {}; ids.forEach(i => (cols[layer[i]] = cols[layer[i]] || []).push(i));
  const vc = viewCenter(); const L = Object.keys(cols).length;
  Object.entries(cols).forEach(([l, arr]) => {
    arr.forEach((id, j) => { const c = cls(id); c.x = vc.x + (l - (L - 1) / 2) * 290; c.y = vc.y + (j - (arr.length - 1) / 2) * 150; });
  });
  // 리소스: 매핑된 클래스 옆, 아니면 아래쪽 줄
  const free = [];
  S.resources.forEach(r => {
    const m = S.mappings.find(x => x.res === r.id); const c = m && cls(m.cls);
    if (!c) { free.push(r); return; }
    placeResource(r, c);
  });
  const b = graphBounds(true);
  free.forEach((r, i) => { r.x = b.minX + i * 140; r.y = b.maxY + 150; });
  S.flags.layout = true;
}
function graphBounds(classesOnly) {
  const pts = S.classes.map(c => [c.x, c.y]).concat(classesOnly ? [] : S.resources.map(r => [r.x, r.y]));
  if (!pts.length) { const v = viewCenter(); return { minX: v.x - 100, maxX: v.x + 100, minY: v.y - 100, maxY: v.y - 100 }; }
  return { minX: Math.min(...pts.map(p => p[0])), maxX: Math.max(...pts.map(p => p[0])), minY: Math.min(...pts.map(p => p[1])), maxY: Math.max(...pts.map(p => p[1])) };
}
function viewCenter() {
  const w = $('#canvasWrap'); const W = w.clientWidth || 900, H = w.clientHeight || 600;
  return { x: (W / 2 - UI.vx) / UI.k, y: (H / 2 + 20 - UI.vy) / UI.k };
}

/* 인스턴스 생성 (게시/탐색용) */
function iri(c, id) { return `tag:stardog:designer:${S.project}:data:${c.name}:${id}`; }
function buildInstances() {
  const nodes = new Map(); const edges = [];
  const key = (c, id) => c.id + '|' + id;
  S.mappings.filter(m => !m.pending).forEach(m => {
    const r = res(m.res), c = cls(m.cls); if (!r || !c) return;
    r.rows.forEach(row => {
      const id = m.primary.map(p => row[p]).join('_'); if (!id) return;
      const k = key(c, id);
      const n = nodes.get(k) || { k, cls: c, id, label: id, props: {} };
      if (m.labelOn && row[m.label]) n.label = row[m.label];
      m.attrs.forEach(a => { const at = attrById(c, a.attr); if (at && row[a.col] !== '' && row[a.col] != null) n.props[at.name] = row[a.col]; });
      nodes.set(k, n);
      m.rels.forEach(x => { const t = cls(x.target), rel = relById(x.rel); if (t && rel && row[x.col]) edges.push({ s: k, t: key(t, row[x.col]), name: rel.name, tc: t }); });
    });
  });
  edges.forEach(e => { if (!nodes.has(e.t)) nodes.set(e.t, { k: e.t, cls: e.tc, id: e.t.split('|')[1], label: e.t.split('|')[1], props: {} }); });
  return { nodes, edges };
}

/* 코드 생성 */
function genTurtle() {
  const P = `tag:stardog:designer:${S.project}:model:`;
  let t = `<span class="k">@prefix</span> : <span class="i">&lt;${P}&gt;</span> .\n<span class="k">@prefix</span> owl: <span class="i">&lt;http://www.w3.org/2002/07/owl#&gt;</span> .\n<span class="k">@prefix</span> rdfs: <span class="i">&lt;http://www.w3.org/2000/01/rdf-schema#&gt;</span> .\n<span class="k">@prefix</span> xsd: <span class="i">&lt;http://www.w3.org/2001/XMLSchema#&gt;</span> .\n`;
  if (!S.classes.length) t += '\n<span class="c"># 아직 정의된 클래스가 없습니다</span>\n';
  S.classes.forEach(c => {
    t += `\n:${c.name} <span class="k">a</span> owl:Class ;\n    rdfs:label <span class="s">"${esc(c.name)}"</span>`;
    if (c.desc) t += ` ;\n    rdfs:comment <span class="s">"${esc(c.desc)}"</span>`;
    if (c.parent && cls(c.parent)) t += ` ;\n    rdfs:subClassOf :${cls(c.parent).name}`;
    t += ' .\n';
  });
  S.rels.forEach(r => r.pairs.forEach(p => { if (cls(p.s) && cls(p.t)) t += `\n:${r.name} <span class="k">a</span> owl:ObjectProperty ;\n    rdfs:domain :${cls(p.s).name} ; rdfs:range :${cls(p.t).name} .\n`; }));
  S.classes.forEach(c => c.attrs.forEach(a => {
    t += `\n:${a.name} <span class="k">a</span> owl:DatatypeProperty ;\n    rdfs:domain :${c.name} ; rdfs:range xsd:${a.type} .\n`;
    if (a.rule) t += `<span class="c"># 규칙: ${RULES.find(r => r[0] === a.rule)[1]}</span>\n`;
  }));
  return t;
}
function genSms(m) {
  const r = res(m.res), c = cls(m.cls); if (!r || !c) return '';
  const P = `tag:stardog:designer:${S.project}`;
  const v = s => '?' + s;
  let body = `  ${v(snake(c.name))} <span class="k">a</span> :${c.name}`;
  if (m.labelOn && m.label) body += ` ;\n    rdfs:label ${v(m.label)}`;
  m.attrs.forEach(a => { const at = attrById(c, a.attr); if (at) body += ` ;\n    :${at.name} ${v(a.col)}`; });
  m.rels.forEach(x => { const rel = relById(x.rel), t = cls(x.target); if (rel && t) body += ` ;\n    :${rel.name} ${v(snake(t.name) + '_iri')}`; });
  body += ' .';
  let where = `  <span class="k">BIND</span>(<span class="k">TEMPLATE</span>(<span class="s">"${P}:data:${c.name}:{${m.primary.join('}_{')}}"</span>) <span class="k">AS</span> ${v(snake(c.name))})`;
  m.rels.forEach(x => { const t = cls(x.target); if (t) where += `\n  <span class="k">BIND</span>(<span class="k">TEMPLATE</span>(<span class="s">"${P}:data:${t.name}:{${x.col}}"</span>) <span class="k">AS</span> ${v(snake(t.name) + '_iri')})`; });
  return `<span class="k">PREFIX</span> : <span class="i">&lt;${P}:model:&gt;</span>\n\n<span class="k">MAPPING</span> <span class="i">&lt;urn:${P}:${r.name}-${c.name}&gt;</span>\n<span class="k">FROM</span> CSV {\n}\n<span class="k">TO</span> {\n${body}\n}\n<span class="k">WHERE</span> {\n${where}\n}`;
}

/* ================= 렌더링 ================= */
const R = 46;
function renderAll() {
  renderCanvas(); renderSide(); renderVoice(); renderChrome();
  if (UI.view === 'list') renderList();
  if (UI.tab === 'mapping') renderMapView();
  if (window.Guide) Guide.refresh();
}
function fitView() {
  const w = $('#canvasWrap'); const W = w.clientWidth, H = w.clientHeight;
  const pts = S.classes.map(c => [c.x - R - 20, c.y - R - 10, c.x + R + 20, c.y + R + 10]).concat(S.resources.map(r => [r.x - 60, r.y - 30, r.x + 60, r.y + 40]));
  if (!pts.length || !W) return;
  const x0 = Math.min(...pts.map(p => p[0])), y0 = Math.min(...pts.map(p => p[1])), x1 = Math.max(...pts.map(p => p[2])), y1 = Math.max(...pts.map(p => p[3]));
  const padT = 60, pad = 30;
  const k = Math.max(.4, Math.min(1.1, (W - pad * 2) / (x1 - x0), (H - padT - pad) / (y1 - y0)));
  UI.k = k; UI.vx = (W - (x1 - x0) * k) / 2 - x0 * k; UI.vy = padT + (H - padT - pad - (y1 - y0) * k) / 2 - y0 * k;
  applyView();
}
function applyView() { $('#world').setAttribute('transform', `translate(${UI.vx},${UI.vy}) scale(${UI.k})`); }

function quad(a, b, bend) {
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
  const cx = (a.x + b.x) / 2 - dy / len * bend, cy = (a.y + b.y) / 2 + dx / len * bend;
  return { cx, cy, len };
}
function trimTo(p, toward, r) { const dx = toward.x - p.x, dy = toward.y - p.y, d = Math.hypot(dx, dy) || 1; return { x: p.x + dx / d * r, y: p.y + dy / d * r }; }

function renderCanvas() {
  const g = $('#world'); const pend = !!S.pending; const q = UI.search.trim().toLowerCase();
  const hit = n => !q || n.toLowerCase().includes(q);
  let h = '';
  // 관계 엣지
  const pairCount = {};
  S.rels.forEach(r => r.pairs.forEach(p => {
    const a = cls(p.s), b = cls(p.t); if (!a || !b) return;
    const key = [p.s, p.t].sort().join('|'); const idx = pairCount[key] = (pairCount[key] || 0) + 1;
    const selected = UI.sel && UI.sel.type === 'rel' && UI.sel.id === r.id;
    let path, lx, ly;
    if (a === b) {
      path = `M${a.x + R * .6},${a.y - R * .8} C${a.x + 120},${a.y - 150} ${a.x + 150},${a.y + 20} ${a.x + R},${a.y + 10}`; lx = a.x + 120; ly = a.y - 70;
    } else {
      const sign = p.s < p.t ? 1 : -1;
      const bend = (idx === 1 ? 0.18 : idx % 2 ? 0.18 + idx * .1 : -(0.1 + idx * .1)) * sign;
      const { cx, cy, len } = quad(a, b, bend * Math.min(Math.hypot(b.x - a.x, b.y - a.y), 400));
      const s = trimTo(a, { x: cx, y: cy }, R + 1), e = trimTo(b, { x: cx, y: cy }, R + 4);
      path = `M${s.x},${s.y} Q${cx},${cy} ${e.x},${e.y}`;
      lx = .25 * s.x + .5 * cx + .25 * e.x; ly = .25 * s.y + .5 * cy + .25 * e.y;
    }
    const dim = q && !(hit(r.name) || hit(a.name) || hit(b.name));
    h += `<g class="edge${selected ? ' sel' : ''}" data-rel="${r.id}" style="${dim ? 'opacity:.2' : ''}"><path class="l" d="${path}" marker-end="url(#${selected ? 'arrS' : 'arr'})"/><path class="hit" d="${path}"/><text x="${lx}" y="${ly}">${esc(r.name)}</text></g>`;
  }));
  // 상속 엣지
  S.classes.forEach(c => { const p = c.parent && cls(c.parent); if (!p) return;
    const s = trimTo(c, p, R + 1), e = trimTo(p, c, R + 6);
    h += `<g class="edge sub"><path class="l" d="M${s.x},${s.y} L${e.x},${e.y}" marker-end="url(#arrH)"/><text x="${(s.x + e.x) / 2}" y="${(s.y + e.y) / 2}">subClassOf</text></g>`; });
  // 매핑 엣지
  S.mappings.forEach(m => {
    const r = res(m.res), c = cls(m.cls); if (!r || !c) return;
    const a = { x: r.x, y: r.y - 6 };
    const { cx, cy } = quad(a, c, -0.25 * Math.min(Math.hypot(c.x - a.x, c.y - a.y), 300));
    const s = trimTo(a, { x: cx, y: cy }, 22), e = trimTo(c, { x: cx, y: cy }, R + 4);
    const lx = .25 * s.x + .5 * cx + .25 * e.x, ly = .25 * s.y + .5 * cy + .25 * e.y;
    const lab = `${r.name} - ${c.name}`;
    const w = lab.length * 6.6 + 14;
    h += `<g class="mapedge${m.pending ? ' pending' : ''}" data-map="${m.id}"><path d="M${s.x},${s.y} Q${cx},${cy} ${e.x},${e.y}" marker-end="url(#${m.pending ? 'arrP' : 'arrM'})"/>${m.pending ? `<rect x="${lx - w / 2}" y="${ly - 10}" width="${w}" height="20" rx="3"/>` : ''}<text x="${lx}" y="${ly}">${esc(lab)}</text></g>`;
  });
  // 클래스 노드
  S.classes.forEach(c => {
    const selected = UI.sel && UI.sel.type === 'class' && UI.sel.id === c.id;
    const mapped = S.mappings.some(m => m.cls === c.id && !m.pending);
    const inPending = pend && S.mappings.some(m => m.cls === c.id && m.pending);
    const fill = pend ? '#fff' : c.color;
    const op = pend ? 1 : selected ? 1 : .62;
    const dim = q && !hit(c.name);
    h += `<g class="node${selected ? ' sel' : ''}${dim ? ' dim' : ''}" data-cls="${c.id}" transform="translate(${c.x},${c.y})">
      <circle r="${R}" fill="${fill}" fill-opacity="${op}" class="b" ${inPending ? 'stroke="#1C1F26" stroke-width="3"' : ''}/>
      ${mapped ? `<g transform="translate(0,-18)" stroke="#1C1F26" stroke-width="1.6" fill="none"><path d="M-6,-5 v10 M-6,0 h5"/><rect x="0" y="-7" width="5" height="5" fill="#1C1F26"/><rect x="0" y="2" width="5" height="5" fill="#1C1F26"/></g>` : ''}
      <text class="n" y="${mapped ? 4 : 0}">${esc(c.name.length > 13 ? c.name.slice(0, 12) + '…' : c.name)}</text>
      ${c.attrs.length ? `<g class="badge" transform="translate(${R * .72},${R * .72})"><rect x="-10" y="-10" width="20" height="20" rx="3"/><text>${c.attrs.length}</text></g>` : ''}
    </g>`;
  });
  // 리소스
  S.resources.forEach(r => {
    const selected = UI.sel && UI.sel.type === 'res' && UI.sel.id === r.id;
    const dim = q && !hit(r.name);
    const nm = r.name.length > 14 ? r.name.slice(0, 13) + '…' : r.name;
    h += `<g class="res${selected ? ' sel' : ''}${dim ? ' dim' : ''}" data-res="${r.id}" transform="translate(${r.x},${r.y})">
      <rect x="-40" y="-26" width="80" height="62" fill="transparent"/>
      <path class="f" d="M-13,-21 h16 l10,10 v30 h-26 z M3,-21 v10 h10"/>
      <text y="31">${esc(nm)}</text></g>`;
  });
  g.innerHTML = h;
  applyView();
  $('#emptyHint').style.display = S.classes.length || S.resources.length ? 'none' : 'grid';
}

/* ================= 캔버스 상호작용 ================= */
(function canvasEvents() {
  const svg = $('#svg'); let drag = null;
  const toWorld = (cx, cy) => { const b = svg.getBoundingClientRect(); return { x: (cx - b.left - UI.vx) / UI.k, y: (cy - b.top - UI.vy) / UI.k }; };
  svg.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    closeCtx();
    const n = e.target.closest('[data-cls],[data-res]');
    if (n) {
      const obj = n.dataset.cls ? cls(n.dataset.cls) : res(n.dataset.res);
      const w = toWorld(e.clientX, e.clientY);
      drag = { obj, ox: w.x - obj.x, oy: w.y - obj.y, moved: false, sx: e.clientX, sy: e.clientY, el: n };
    } else {
      drag = { pan: true, sx: e.clientX, sy: e.clientY, vx: UI.vx, vy: UI.vy, moved: false };
      svg.classList.add('panning');
    }
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 4) drag.moved = true;
    if (!drag.moved) return;
    if (drag.pan) { UI.vx = drag.vx + e.clientX - drag.sx; UI.vy = drag.vy + e.clientY - drag.sy; applyView(); return; }
    const w = toWorld(e.clientX, e.clientY); drag.obj.x = w.x - drag.ox; drag.obj.y = w.y - drag.oy; renderCanvas();
  });
  svg.addEventListener('pointerup', e => {
    svg.classList.remove('panning');
    const d = drag; drag = null; if (!d) return;
    if (d.moved && !d.pan) { saving(); return; }
    if (d.moved) return;
    // 클릭으로 처리
    const t = document.elementFromPoint(e.clientX, e.clientY);
    canvasClick(t, e.clientX, e.clientY);
  });
  svg.addEventListener('dblclick', e => {
    const n = e.target.closest('[data-cls]'); if (n) { openClassDetail(n.dataset.cls); return; }
    const r = e.target.closest('[data-res]'); if (r) openResourceDetail(r.dataset.res);
  });
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const b = svg.getBoundingClientRect(); const mx = e.clientX - b.left, my = e.clientY - b.top;
    const k = Math.min(2.2, Math.max(.35, UI.k * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
    UI.vx = mx - (mx - UI.vx) * k / UI.k; UI.vy = my - (my - UI.vy) * k / UI.k; UI.k = k; applyView();
  }, { passive: false });
})();

function canvasClick(t, x, y) {
  const n = t && t.closest && t.closest('[data-cls]'), r = t && t.closest && t.closest('[data-res]'), ed = t && t.closest && t.closest('[data-rel]');
  if (n) { UI.sel = { type: 'class', id: n.dataset.cls }; renderAll(); classMenu(n.dataset.cls); return; }
  if (r) { UI.sel = { type: 'res', id: r.dataset.res }; renderAll(); resourceMenu(r.dataset.res); return; }
  if (ed) { UI.sel = { type: 'rel', id: ed.dataset.rel }; renderAll(); openRelDetail(ed.dataset.rel); return; }
  if (UI.sel) { UI.sel = null; renderAll(); }
}
function screenOf(obj, dy = 0) {
  const b = $('#svg').getBoundingClientRect();
  return { x: b.left + UI.vx + obj.x * UI.k, y: b.top + UI.vy + (obj.y + dy) * UI.k };
}

/* ================= 콤보박스 ================= */
function combo({ name, placeholder = '선택', options, value = '', allowCreate = false, multi = false, chips = false, onPick, filterPh = 'Filter or create...' }) {
  const box = el(`<div class="combo" data-combo="${name}"></div>`);
  let sel = multi ? [...(value || [])] : value;
  const opts = () => (typeof options === 'function' ? options() : options).map(o => typeof o === 'string' ? { v: o, l: o } : o);
  const labelOf = v => (opts().find(o => o.v === v) || { l: v }).l;
  const head = () => {
    if (chips) return `<div class="chips combo-btn" style="height:auto;background:#fff">${sel.length ? sel.map(v => `<span class="chip">${esc(labelOf(v))}<button data-rm="${esc(v)}" aria-label="제거">×</button></span>`).join('') : `<span class="ph">${esc(placeholder)}</span>`}</div>`;
    return `<button type="button" class="combo-btn">${sel && !multi ? `<span class="v">${esc(labelOf(sel))}</span>` : `<span class="ph">${esc(placeholder)}</span>`}${ICON.caret}</button>`;
  };
  const draw = () => {
    box.innerHTML = head() + `<div class="combo-pop"><label class="cs">${ICON.search}<input placeholder="${esc(filterPh)}"></label><ul></ul></div>`;
    const inp = $('input', box), ul = $('ul', box);
    const list = () => {
      const f = inp.value.trim(); const fl = f.toLowerCase();
      const os = opts().filter(o => !(multi && sel.includes(o.v)) && o.l.toLowerCase().includes(fl));
      let h = os.map(o => `<li data-v="${esc(o.v)}">${esc(o.l)}</li>`).join('');
      if (allowCreate && f && !opts().some(o => o.l.toLowerCase() === fl)) h += `<li class="create" data-new="${esc(f)}">⊕ Create "${esc(f)}"</li>`;
      ul.innerHTML = h || '<li class="none">No Results</li>';
    };
    inp.oninput = list; list();
    inp.onkeydown = e => { if (e.key === 'Enter') { const li = $('li[data-v],li[data-new]', ul); if (li) li.click(); e.preventDefault(); } if (e.key === 'Escape') box.classList.remove('open'); };
    ul.onclick = e => {
      const li = e.target.closest('li'); if (!li || li.classList.contains('none')) return;
      const v = li.dataset.new || li.dataset.v;
      if (multi) { sel.push(v); draw(); } else { sel = v; box.classList.remove('open'); draw(); }
      onPick && onPick(multi ? sel : v, !!li.dataset.new);
    };
    $('.combo-btn', box).onclick = e => {
      const rm = e.target.closest('[data-rm]');
      if (rm) { sel = sel.filter(x => x !== rm.dataset.rm); draw(); onPick && onPick(sel); e.stopPropagation(); return; }
      const open = !box.classList.contains('open');
      $$('.combo.open').forEach(c => c.classList.remove('open'));
      box.classList.toggle('open', open); if (open) { inp.value = ''; list(); setTimeout(() => inp.focus(), 0); }
    };
  };
  draw();
  box.getValue = () => sel; box.setValue = v => { sel = v; draw(); };
  return box;
}

function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; continue; }
    if (ch === '"') q = true; else if (ch === ',') { row.push(f); f = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; } else f += ch;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.replace(/^\uFEFF/, '').trim());
  return { cols: head, rows: rows.filter(r => r.some(x => x !== '')).map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? '']))) };
}
function readRealFiles(list) {

function openExplorer(focusLabel) {
  const inst = buildInstances();
  if (!inst.nodes.size) { toast('승인된 매핑이 없어 탐색할 개체가 없습니다.'); return; }
  const all = [...inst.nodes.values()];
  let center = (focusLabel && all.find(n => n.label === focusLabel)) || all.find(n => n.label === '인터스텔라') || all[0];
  const m = openModal(`<div class="mod-h"><h3>Explorer · ${esc(S.published?.db || S.project)}</h3><button class="x" data-mclose aria-label="닫기">×</button></div>
    <div class="ex-top"><input id="exQ" placeholder="개체 검색 (예: 놀란, 기생충)" list="exList"><datalist id="exList">${all.slice(0, 400).map(n => `<option value="${esc(n.label)}">`).join('')}</datalist><span class="hint">노드를 누르면 그 개체를 중심으로 이동합니다.</span></div>
    <div class="ex"><div class="ex-g"><svg id="exSvg"></svg></div><div class="ex-p" id="exP"></div></div>`, 'wide');
  const adj = k => { const out = []; inst.edges.forEach(e => { if (e.s === k) out.push({ k: e.t, name: e.name, out: true }); if (e.t === k) out.push({ k: e.s, name: e.name, out: false }); }); return out; };
  const draw = () => {
    const sv = $('#exSvg', m); const W = sv.clientWidth || 800, H = sv.clientHeight || 520; const cx = W / 2, cy = H / 2;
    const nb = adj(center.k); const ring = nb.slice(0, 12);
    const r1 = Math.min(W, H) * .24, r2 = Math.min(W, H) * .43;
    const P = new Map(); P.set(center.k, { x: cx, y: cy, r: 34, n: center });
    const E = [];
    ring.forEach((x, i) => {
      const a = i / ring.length * Math.PI * 2 - Math.PI / 2;
      if (!P.has(x.k)) P.set(x.k, { x: cx + Math.cos(a) * r1, y: cy + Math.sin(a) * r1, r: 22, n: inst.nodes.get(x.k), a });
      E.push({ s: x.out ? center.k : x.k, t: x.out ? x.k : center.k, name: x.name });
    });
    if (ring.length <= 8) ring.forEach(x => { // 두 번째 고리: 이웃의 이웃
      const base = P.get(x.k); const sub = adj(x.k).filter(y => y.k !== center.k).slice(0, 3);
      sub.forEach((y, j) => {
        if (!P.has(y.k)) { const a = base.a + (j - (sub.length - 1) / 2) * (Math.PI / Math.max(6, ring.length * 1.6)); P.set(y.k, { x: cx + Math.cos(a) * r2, y: cy + Math.sin(a) * r2, r: 18, n: inst.nodes.get(y.k) }); }
        E.push({ s: y.out ? x.k : y.k, t: y.out ? y.k : x.k, name: y.name, far: true });
      });
    });
    let h = '';
    E.forEach(e => { const a = P.get(e.s), b = P.get(e.t); if (!a || !b) return;
      const s = trimTo(a, b, a.r + 2), t = trimTo(b, a, b.r + 5);
      h += `<g class="exe"${e.far ? ' style="opacity:.8"' : ''}><path d="M${s.x},${s.y} L${t.x},${t.y}" marker-end="url(#exArr)"/><text x="${(s.x + t.x) / 2}" y="${(s.y + t.y) / 2}">${esc(e.name)}</text></g>`; });
    P.forEach((p, k) => { const lab = p.n.label.length > 16 ? p.n.label.slice(0, 15) + '…' : p.n.label;
      h += `<g class="exn${k === center.k ? ' c' : ''}" data-k="${esc(k)}" transform="translate(${p.x},${p.y})"><circle r="${p.r}" fill="${p.n.cls.color}"/><text y="${p.r + 14}">${esc(lab)}</text></g>`; });
    sv.innerHTML = `<defs><marker id="exArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#8A919E"/></marker></defs>` + h + (nb.length > 12 ? `<text x="12" y="${H - 12}" font-size="11" fill="#8A919E">연결 ${nb.length}개 중 12개 표시</text>` : '');
    $$('.exn[data-k]', sv).forEach(g => g.onclick = () => { center = inst.nodes.get(g.dataset.k); draw(); });
    $('#exP', m).innerHTML = `<span class="cls" style="background:${center.cls.color}">${esc(center.cls.name)}</span><h4>${esc(center.label)}</h4>
      <dl><dt>IRI</dt><dd style="font-size:11px">${esc(iri(center.cls, center.id))}</dd>${Object.entries(center.props).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}
      <dt>관계</dt><dd>${nb.map(x => { const n = inst.nodes.get(x.k); return `${x.out ? '' : '← '}${esc(x.name)} ${x.out ? '→ ' : ''}${esc(n.label)}`; }).slice(0, 30).join('<br>') || '—'}</dd></dl>`;
  };
  requestAnimationFrame(draw);
  $('#exQ', m).onchange = e => { const f = all.find(n => n.label === e.target.value) || all.find(n => n.label.includes(e.target.value)); if (f) { center = f; draw(); } };
}

    } else if (mAsk) {

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (Director.running) { Director.stop(); return; }
    if ($('#modalLayer').classList.contains('on')) { closeModal(); return; }
    if ($('.ctx')) { closeCtx(); return; }
    if ($('#drawer').classList.contains('on')) { closeDrawer(); return; }
  }
  const typing = e.target.closest('input,textarea,select,[contenteditable]');
  if (typing || Director.running) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && UI.sel && !$('#drawer').classList.contains('on')) { $('[data-act=delete]').click(); return; }
  if (e.key === 'g' || e.key === 'G') Guide.toggleMin();
});
addEventListener('resize', () => renderCanvas());

/* ================= 자동 실행 (Director) ================= */
const Director = {
  running: false, speed: 1, aborted: false,
  ghost: $('#ghost'), gx: innerWidth / 2, gy: innerHeight / 2,
  check() { if (this.aborted) throw new Error('aborted'); },
  async wait(ms) { await sleep(ms / this.speed); this.check(); },
  async find(sel, timeout = 4000) {
    const t0 = Date.now();
    while (Date.now() - t0 < timeout) { this.check(); const n = typeof sel === 'function' ? sel() : $(sel); if (n && n.getClientRects().length) return n; await sleep(60); }
    throw new Error('요소를 찾지 못했습니다: ' + sel);
  },
  async moveTo(x, y) { this.ghost.style.transform = `translate(${x - 3}px,${y - 2}px)`; this.gx = x; this.gy = y; await this.wait(520); },
  async point(n) { const r = n.getBoundingClientRect(); await this.moveTo(r.left + Math.min(r.width / 2, 60), r.top + r.height / 2); },
  ripple(x, y) { const d = el(`<div class="ripple" style="left:${x}px;top:${y}px"></div>`); document.body.appendChild(d); setTimeout(() => d.remove(), 520); },
  async click(sel) { const n = await this.find(sel); n.scrollIntoView?.({ block: 'nearest' }); await this.point(n); this.ripple(this.gx, this.gy); await this.wait(140); n.click(); await this.wait(260); return n; },
  async clickNode(obj, menuLabel) {
    await this.wait(80); const p = screenOf(obj); await this.moveTo(p.x, p.y); this.ripple(p.x, p.y); await this.wait(140);
    const isRes = !!obj.cols; UI.sel = { type: isRes ? 'res' : 'class', id: obj.id }; renderAll(); isRes ? resourceMenu(obj.id) : classMenu(obj.id);
    await this.wait(380);
    if (menuLabel) await this.click(() => $$('.ctx button').find(b => b.textContent.trim() === menuLabel));
  },
  async type(sel, text) {
    const n = await this.find(sel); await this.point(n); this.ripple(this.gx, this.gy); n.focus(); n.value = '';
    for (const ch of text) { n.value += ch; n.dispatchEvent(new Event('input', { bubbles: true })); await this.wait(55); }
    n.dispatchEvent(new Event('change', { bubbles: true })); await this.wait(150);
  },
  async pick(comboName, label, create) {
    const box = await this.find(() => $$(`[data-combo="${comboName}"]`).filter(b => b.getClientRects().length).pop());
    await this.click(() => $('.combo-btn', box));
    const inp = $('.combo-pop input', box);
    for (const ch of label) { inp.value += ch; inp.dispatchEvent(new Event('input')); await this.wait(45); }
    await this.wait(160);
    await this.click(() => $$('.combo-pop li', box).find(li => li.dataset.new === label || li.textContent.trim() === label));
  },
  async run(fn, label) {
    if (this.running) return;
    this.running = true; this.aborted = false;
    $('#shield').classList.add('on'); this.ghost.classList.add('on'); $('#runBadge').classList.add('on'); $('#runText').textContent = label + ' 자동 실행 중';
    this.ghost.style.transform = `translate(${this.gx}px,${this.gy}px)`;
    Guide.refresh();
    try { await fn(this); }
    catch (err) { if (err.message !== 'aborted') { console.error(err); toast('자동 실행을 멈췄습니다: ' + esc(err.message)); } else toast('자동 실행을 중지했습니다.'); }
    finally { this.running = false; $('#shield').classList.remove('on'); this.ghost.classList.remove('on'); $('#runBadge').classList.remove('on'); closeCtx(); Guide.refresh(); }
  },
  stop() { this.aborted = true; }
};

/* ================= 설명 가이드 ================= */
const CLASSES = [['Movie', '영화 작품'], ['Credit', '영화와 인물을 잇는 작품 참여(크레딧)'], ['CreditType', '감독·배우 같은 참여 역할'], ['Person', '감독·배우 인물']];

const FILES = ['MOVIE', 'MOVIE_CREDIT', 'PERSON', 'CREDIT_TYPE_CODE'];
const MAPS = [['MOVIE', 'Movie'], ['PERSON', 'Person'], ['MOVIE_CREDIT', 'Credit'], ['CREDIT_TYPE_CODE', 'CreditType']];

    p: ['툴바 ● Add class', 'Class Name 입력', 'Create'],
    done: () => CLASSES.every(c => clsByName(c[0])),
    apply: () => CLASSES.forEach(([n, d], i) => { if (!clsByName(n)) { const c = addClass(n, d); const v = viewCenter(); c.x = v.x + 160; c.y = v.y - 210 + i * 105; } }),
    async run(D) { for (const [n, d] of CLASSES) { if (clsByName(n)) continue; await D.click('[data-act=add-class]'); await D.type('#cc-name', n); await D.type('#cc-desc', d); await D.click('#ccCreate'); await D.wait(350); } } },
  { t: '관계 만들기', d: 'Credit을 출발점으로 세 관계를 연결합니다. appearsIn은 영화, involvesPerson은 인물, hasCreditType은 역할을 가리킵니다. Source와 Target을 고르면 아래 표에 실제로 생길 연결이 미리 보입니다.',
    p: ['툴바 Add relationship', 'Relationship Name', 'Source / Target 선택', 'Create'],
    done: () => RELS.every(r => relByName(r[0])),
    apply: () => RELS.forEach(([n, s, t]) => addRel(n, [{ s: clsByName(s).id, t: clsByName(t).id }])),
